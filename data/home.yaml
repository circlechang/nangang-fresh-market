intro:
  eyebrow: 我們相信
  title: 新鮮不只是食材，
    也是一種鄰里關係。
  body: 從一個攤位、一家小店，到一張餐桌，南港新鮮市希望讓好的東西被看見，也讓採買不再只是交易，而是每天都能發生的小型相遇。

principles:
  - number: 01
    title: 看得見來源
    body: 把產地、季節與選擇理由說清楚，讓新鮮不是一句口號。
  - number: 02
    title: 走得到日常
    body: 以南港生活圈為半徑，整理真正方便帶走、帶回家、帶進餐桌的選擇。
  - number: 03
    title: 一起把市集做好
    body: 讓店家、居民與合作夥伴，都能在同一個平台上被找到、被理解。

signals:
  - value: 01
    label: 今日鮮選
