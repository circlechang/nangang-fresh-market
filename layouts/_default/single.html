{{ define "main" }}
<article class="article section-wrap">
  <div class="article-head"><p class="eyebrow">{{ .Section | upper }}</p><h1>{{ .Title }}</h1>{{ with .Params.summary }}<p class="hero-lead">{{ . }}</p>{{ end }}</div>
  <div class="article-body">{{ .Content }}</div>
  <a class="button button-text" href="{{ .Parent.RelPermalink }}">← 回到{{ .Parent.Title }}</a>
</article>
{{ end }}
